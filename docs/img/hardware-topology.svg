<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>TP-Link Archer AX23 v2 hardware topology (dark theme)</title>
<desc>SoC Qualcomm IPQ5018 connected via HSGMII 2.5G to the switch Realtek RTL8367SC, which exposes 5 Ethernet ports (wan, lan1-lan4); two radios WiFi (2.4GHz internal and 5GHz QCN6102) come out of SoC; NAND SPI 128MB with 16 partitions.</desc>

<defs>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- GitHub dark background -->
<rect width="680" height="480" fill="#0D1117"/>

<!-- Outer container: board -->
<rect x="40" y="30" width="600" height="300" rx="20" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="60" y="58" font-family="sans-serif" font-size="14" font-weight="500" fill="#E6EDF3">Archer AX23 v2 Board</text>
<text x="60" y="76" font-family="sans-serif" font-size="12" fill="#8B949E">IPQ5018, 256MB RAM</text>

<!-- SoC box -->
<rect x="80" y="100" width="200" height="90" rx="12" fill="#0C2D48" stroke="#388BFD" stroke-width="0.75"/>
<text x="180" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#79C0FF">IPQ5018 SoC</text>
<text x="180" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#58A6FF">gmac1, HSGMII fixed-link</text>
<text x="180" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#58A6FF">2500/full, uniphy0 50MHz</text>

<!-- Switch box -->
<rect x="380" y="100" width="220" height="90" rx="12" fill="#0D2E22" stroke="#3FB950" stroke-width="0.75"/>
<text x="490" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#7EE787">Realtek RTL8367SC</text>
<text x="490" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#56D364">mdio1, addr 29</text>
<text x="490" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#56D364">reset: GPIO39, low active</text>

<!-- SGMII connector -->
<line x1="280" y1="145" x2="378" y2="145" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
<text x="329" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8B949E">HSGMII</text>

<!-- Ports row -->
<rect x="380" y="220" width="52" height="40" rx="8" fill="#3D1E12" stroke="#DB6D28" stroke-width="0.75"/>
<text x="406" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#FFA657">wan</text>

<rect x="442" y="220" width="52" height="40" rx="8" fill="#3D1E12" stroke="#DB6D28" stroke-width="0.75"/>
<text x="468" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#FFA657">lan1</text>

<rect x="504" y="220" width="52" height="40" rx="8" fill="#3D1E12" stroke="#DB6D28" stroke-width="0.75"/>
<text x="530" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#FFA657">lan2</text>

<rect x="380" y="270" width="52" height="40" rx="8" fill="#3D1E12" stroke="#DB6D28" stroke-width="0.75"/>
<text x="406" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#FFA657">lan3</text>

<rect x="442" y="270" width="52" height="40" rx="8" fill="#3D1E12" stroke="#DB6D28" stroke-width="0.75"/>
<text x="468" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#FFA657">lan4</text>

<line x1="490" y1="190" x2="490" y2="218" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
<text x="500" y="204" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8B949E">5 ports</text>

<!-- Radios -->
<rect x="80" y="220" width="200" height="40" rx="8" fill="#211A3D" stroke="#A371F7" stroke-width="0.75"/>
<text x="180" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#D2A8FF">WiFi 2.4GHz (internal IPQ5018)</text>

<rect x="80" y="270" width="200" height="40" rx="8" fill="#211A3D" stroke="#A371F7" stroke-width="0.75"/>
<text x="180" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#D2A8FF">WiFi 5GHz (QCN6102)</text>

<line x1="180" y1="190" x2="180" y2="218" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

<!-- NAND -->
<rect x="250" y="360" width="180" height="56" rx="12" fill="#3B2D0B" stroke="#D29922" stroke-width="0.75"/>
<text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#F2CC60">SPI-NAND 128MB</text>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#E3B341">16 partitions, qpic_nand</text>

<line x1="180" y1="330" x2="300" y2="358" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

</svg>
