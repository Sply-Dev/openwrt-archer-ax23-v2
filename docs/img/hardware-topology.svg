<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Topologia de hardware do TP-Link Archer AX23 v2</title>
<desc>SoC Qualcomm IPQ5018 conectado via SGMII ao switch Realtek RTL8367SC, que expoe 5 portas Ethernet (wan, lan1-lan4); dois radios WiFi (2.4GHz interno e 5GHz QCN6102) saem do SoC; NAND SPI de 128MB com 16 particoes.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="480" fill="#FFFFFF"/>

<!-- Outer container: board -->
<rect x="40" y="30" width="600" height="300" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="58" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Placa Archer AX23 v2</text>
<text x="60" y="76" font-family="sans-serif" font-size="12" fill="#5F5E5A">IPQ5018, 256MB RAM</text>

<!-- SoC box -->
<rect x="80" y="100" width="200" height="90" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">IPQ5018 SoC</text>
<text x="180" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">gmac1, SGMII fixed-link</text>
<text x="180" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">1000/full, uniphy0 25MHz</text>

<!-- Switch box -->
<rect x="380" y="100" width="220" height="90" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Realtek RTL8367SC</text>
<text x="490" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">mdio1, addr 29</text>
<text x="490" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">reset: GPIO33, ativo baixo</text>

<!-- SGMII connector -->
<line x1="280" y1="145" x2="378" y2="145" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="329" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">SGMII</text>

<!-- Ports row -->
<rect x="380" y="220" width="52" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="406" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">wan</text>

<rect x="442" y="220" width="52" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="468" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">lan1</text>

<rect x="504" y="220" width="52" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="530" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">lan2</text>

<rect x="380" y="270" width="52" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="406" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">lan3</text>

<rect x="442" y="270" width="52" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="468" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">lan4</text>

<line x1="490" y1="190" x2="490" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">5 portas</text>

<!-- Radios -->
<rect x="80" y="220" width="200" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">WiFi 2.4GHz (interno IPQ5018)</text>

<rect x="80" y="270" width="200" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">WiFi 5GHz (QCN6102)</text>

<line x1="180" y1="190" x2="180" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- NAND -->
<rect x="250" y="360" width="180" height="56" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">SPI-NAND 128MB</text>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">16 particoes, qpic_nand</text>

<line x1="180" y1="330" x2="300" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
